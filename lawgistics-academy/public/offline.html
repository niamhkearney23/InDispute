<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>No connection</title>
<style>
  /* Fixed words and no brand: this page is the same on every firm's copy. */
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; box-sizing: border-box;
    background: #0d1b2a; color: #f7f4ee;
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 26rem; }
  h1 { font: 500 28px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 12px; }
  p { margin: 0 0 14px; color: #c9d3e0; }
  button {
    margin-top: 8px; min-height: 48px; padding: 12px 22px; border: 0; border-radius: 8px;
    background: #f7f4ee; color: #0d1b2a; font: 600 16px/1 inherit; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #9fb4d0; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>No connection</h1>
  <p>The academy needs the internet. Every answer is timed and marked on the server, so there is nothing to do offline and nothing is lost.</p>
  <p>This page opens the academy again by itself when the connection comes back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>

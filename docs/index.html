<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Court Update · Case Lookup — Thomas Philip</title>
<style>
  :root {
    --navy: #0F1720; --gold: #B89554; --cream: #F5F3EF; --ink: #2c3440;
    --paper: #ffffff; --line: #EAE5D9; --muted: #8a8578;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--ink); font-family: Georgia, 'Times New Roman', serif; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

  header { background: var(--navy); text-align: center; padding: 40px 20px 34px; }
  header .firm { color: var(--gold); font-size: 13px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 6px; }
  header h1 { color: #fff; font-size: 30px; font-weight: normal; letter-spacing: 1px; }
  header .rule { width: 40px; height: 2px; background: var(--gold); margin: 16px auto; }
  header .sub { color: #C8C2B4; font-style: italic; font-size: 15px; }

  .controls { position: sticky; top: 0; z-index: 5; background: var(--paper);
    border-bottom: 1px solid var(--line); padding: 16px 20px; box-shadow: 0 2px 10px rgba(15,23,32,.05); }
  .controls-inner { max-width: 860px; margin: 0 auto; }
  .search { width: 100%; font-size: 16px; padding: 12px 16px; border: 1px solid #d8d2c4;
    border-radius: 8px; background: #FBFAF7; color: var(--ink); font-family: inherit; }
  .search:focus { outline: 2px solid var(--gold); border-color: var(--gold); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  .chip { font-size: 13px; padding: 5px 14px; border-radius: 16px; border: 1px solid #ddd6c6;
    background: #F7F4EC; color: #6B5B33; cursor: pointer; }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip:hover:not(.on) { border-color: var(--gold); }
  select { font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid #ddd6c6;
    background: #F7F4EC; color: #6B5B33; }
  .count { font-size: 13px; color: var(--muted); margin-left: auto; }

  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    margin-bottom: 16px; overflow: hidden; }
  .card summary { list-style: none; cursor: pointer; padding: 22px 24px; }
  .card summary::-webkit-details-marker { display: none; }
  .card summary:hover { background: #FDFCF9; }
  .meta { display: flex; align-items: baseline; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .outcome { font-weight: 700; letter-spacing: 1px; margin-left: auto; }
  .hook { font-size: 20px; font-weight: 700; color: var(--navy); line-height: 1.3; margin-bottom: 8px; }
  .case-name { font-style: italic; font-size: 14px; color: #777; }
  .citation { font-size: 12px; color: #999; line-height: 1.5; margin-top: 2px; }
  .tagrow { margin-top: 10px; }
  .tag { display: inline-block; background: #F0EBDF; color: #6B5B33; border: 1px solid #E0D6C0;
    border-radius: 12px; padding: 2px 10px; font-size: 11px; margin: 0 6px 4px 0; letter-spacing: .3px; }
  .body { padding: 0 24px 24px; border-top: 1px solid var(--line); }
  .label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin: 18px 0 4px; }
  .text { font-size: 15px; line-height: 1.7; }
  .open-hint { font-size: 12px; color: var(--gold); margin-top: 10px; }
  details[open] .open-hint { display: none; }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-style: italic; }
  footer { text-align: center; font-size: 11px; color: #999; padding: 30px 20px 50px; line-height: 1.6; }
  footer .firmline { letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  mark { background: #F3E5C3; color: inherit; padding: 0 1px; }
  @media (max-width: 600px) { .hook { font-size: 18px; } header h1 { font-size: 24px; } }
</style>
</head>
<body>

<header>
  <div class="firm sans">Thomas Philip</div>
  <h1>COURT UPDATE · CASE LOOKUP</h1>
  <div class="rule"></div>
  <div class="sub">Every case we’ve covered, searchable</div>
</header>

<div class="controls sans">
  <div class="controls-inner">
    <input id="q" class="search" type="search"
      placeholder="Search cases — try &ldquo;security for costs&rdquo;, &ldquo;nominee&rdquo;, &ldquo;winding-up&rdquo;, a party name&hellip;"
      autocomplete="off">
    <div class="filters">
      <div id="areaChips"></div>
      <select id="court">
        <option value="">All courts</option>
        <option>Court of Appeal</option>
        <option>High Court</option>
      </select>
      <select id="edition"><option value="">All editions</option></select>
      <span class="count" id="count"></span>
    </div>
  </div>
</div>

<main id="results"></main>

<footer class="sans">
  <div class="firmline">Thomas Philip &middot; Advocates &amp; Solicitors</div>
  Summaries prepared from our reading of the judgments; verify figures and citations against the sealed
  judgments before relying on them. General information, not legal advice.
</footer>

<script>
var DB = {"cases":[{"hook":"The RM300,000 front page","area":"Defamation","tags":["📰 Defamation","⚖️ Court of Appeal","🔥 Damages raised"],"name":"Star Media Group Bhd & Ors v Jason Jonathan Lo","citation":"B-02(NCvC)(W)-2076 & 2096-12/2023 · Court of Appeal · Collin Lawrence Sequerah JCA (now FCJ), Faizah binti Jamaludin JCA, Ong Chee Kwan JCA","story":"A national daily ran two articles pinning allegations of serious criminal misconduct on an identifiable man — and could not prove them. The High Court awarded him RM200,000. The Court of Appeal decided that was not enough, and threw in a mandatory retraction in The Star and on The Star Online for good measure.","courtSaid":"Justification and qualified privilege only protect responsible journalism — publishing unproven allegations of serious crime is not that. General damages went up to a global RM300,000, though the refusal of aggravated and exemplary damages (and of a compelled apology) stood, and the paper’s cross-appeal on liability was dismissed.","whyYouCare":"Two takeaways for the price of one. If you act for publishers: the responsible-journalism standard has real teeth, and “we reported the allegation” is not a defence to unproven claims of crime. If you draft pleadings: English impugned words reproduced verbatim in an otherwise Bahasa Malaysia pleading, without translation, do not nullify the claim — substance prevails over form, and the Rekha Munisamy line did not defeat the action.","outcome":"ALLOWED IN PART","edition":"20 July 2026","court":"Court of Appeal"},{"hook":"One defendant asked for security. The whole suit is now on the line.","area":"Security for costs","tags":["⏳ 14-day deadline","💣 Automatic strike-out","💰 Security for costs"],"name":"Dato’ Richard Dilaan Morais v Raam Kumar & Ors","citation":"AA-22NCvC-34-04/2024 · High Court of Malaya at Ipoh · Moses Susayan J","story":"The plaintiff has been an undischarged bankrupt since 2013 — which is a problem when you’re suing several defendants who would like their costs back if they win. Only the 4th defendant applied for security. The order it got protects everyone.","courtSaid":"RM50,000 in security within 14 days, failing which the entire action against all defendants is automatically struck out on day 15, no further order required. Where the claims are so intertwined that a partial strike-out would give the applicant “no meaningful protection”, the whole-action sanction is proportionate.","whyYouCare":"If you act for one of several defendants against an impecunious or bankrupt plaintiff, your security application may be able to carry a whole-action sanction — the plaintiff cannot ring-fence the rest of the suit just because only your client asked. And if you act for the plaintiff: diarise that deadline like your practising certificate depends on it.","outcome":"ALLOWED","edition":"20 July 2026","court":"High Court"},{"hook":"“A grievance in search of a case”","area":"Probate","tags":["🪦 Probate","✂️ Struck out pre-trial","🔍 No particulars"],"name":"Manjula a/p Manikah v Sharmila Nageswaran","citation":"WA-22NCvC-674-11/2025 · High Court of Malaya at Kuala Lumpur · Arziah binti Mohamed Apandi J","story":"The youngest daughter said her late parent’s Rockwills will was forged and the testator lacked capacity. Her evidence of forgery: her own eyesight. Her medical evidence of incapacity: none. The prayers also named the wrong deceased person.","courtSaid":"Struck out in its entirety before trial. The threshold for striking out is deliberately high — but a claim built on conclusions rather than facts, suspicion rather than evidence, and aspersions rather than particulars fails even that generous test.","whyYouCare":"Fraud and forgery are the easiest things to allege and the hardest to plead properly. If you’re challenging a will: particulars, an expert or documentary basis, medical records for incapacity — and proofread the prayers, because misnaming the deceased is the kind of detail a strike-out application feasts on.","outcome":"STRUCK OUT","edition":"20 July 2026","court":"High Court"},{"hook":"Six new BMWs, one overturned trailer, no indemnity","area":"Insurance","tags":["🚛 Goods-in-transit","🧾 Escape clause","🔁 Subrogation"],"name":"BLG Swift Logistics Sdn Bhd v Pantrans Haulage Sdn Bhd (Tokio Marine Insurans, Third Party)","citation":"WA-22NCvC-1012-12/2019 · High Court of Malaya at Kuala Lumpur · Raja Ahmad Mohzanuddin Shah J","story":"A trailer carrying six new BMWs overturned between Kulim and Port Klang. The haulier had already lost the negligence claim, so it turned to its goods-in-transit insurer for indemnity — which pointed calmly at the “other insurance” escape clause.","courtSaid":"Third-party claim dismissed. The cargo interest’s insurer (Lonpac) had already paid and taken subrogation, so the non-contribution / escape clause was engaged and the GIT policy did not respond to the indemnity claimed.","whyYouCare":"Before advising a haulier that “the insurer will pick this up”, read the non-contribution clause. Once the goods-owner’s own insurer has paid and stepped into the claim, your client’s transit cover may be out of the picture entirely — and the haulier is left holding the judgment alone.","outcome":"DISMISSED","edition":"20 July 2026","court":"High Court"},{"hook":"Being the named nominee doesn’t make it your money","area":"Estate","tags":["🧾 12 policies","⚖️ Statutory trust","🏛️ Order 80"],"name":"Chung Soh Eng v Chung Yang Huang & Ors","citation":"WA-24NCvC-5928-12/2025 · High Court of Malaya at Kuala Lumpur · Nixon anak Kennedy Kumbong JC","story":"A man died intestate, and the proceeds of twelve insurance policies — nine of them AIA life policies — were paid out to the named nominees. No assignment was ever made. One nominee quietly handed the money back. The rest were sued by an estate beneficiary under Order 80.","courtSaid":"Allowed. Absent a valid assignment, a nominee outside the protected class holds the proceeds as executor or trustee for the estate under Schedule 10 of the Financial Services Act 2013 — not beneficially. Pay it back, with accounts and disclosure by affidavit.","whyYouCare":"Clients routinely believe a nomination is estate planning. It isn’t — outside the protected class, the nominee is a statutory trustee, and an estate beneficiary can use Order 80 as a fast preservatory route to claw the proceeds back before administration even begins. Useful sword; sobering client-advice point.","outcome":"ALLOWED","edition":"20 July 2026","court":"High Court"},{"hook":"The RM42 million email that wasn’t a variation","area":"Commercial contract","tags":["✈️ Aircraft charter","📉 Formalities matter","💸 Costs pain"],"name":"P-Cube Aviation Pte Ltd v J&T International Logistics (Malaysia) Sdn Bhd","citation":"WA-27NCC-28-05/2024 · High Court of Malaya at Kuala Lumpur (Commercial Division) · Quay Chew Soon J","story":"The charterer used the aircraft arrangement exactly once. The owner claimed RM42,315,000 in cancellation charges, resting a “guaranteed minimum of four flights daily” on a variation it said was made by a 9 October 2022 email. The case ended with money flowing the other way.","courtSaid":"Claim dismissed. Clause 3 of the charter permitted variation of the schedule, route and aircraft type only — not the rate, the guaranteed minimum or the minimum weight — and the clause 18(d) formalities were never satisfied, so the email could not operate as a variation. The claimant was ordered to pay the RM9,459.14 counterclaim with 5% interest, plus RM50,000 costs.","whyYouCare":"A variation clause covers what it says it covers — you cannot import words into it, however large the invoice built on top. Before pleading a varied term, check (1) whether the clause reaches that term at all and (2) whether the prescribed variation procedure was actually followed. An email trail is not a substitute for either.","outcome":"DISMISSED","edition":"20 July 2026","court":"High Court"},{"hook":"The defence nobody turned up to defend","area":"Civil procedure","tags":["🏚️ Liquidation","📄 Abandoned defence","🛠️ O.34 r.6(1)"],"name":"Tan Kok Aun & Anor v Prolific Properties Sdn Bhd (in liquidation)","citation":"MA-22NCvC-25-04/2024 · High Court of Malaya at Melaka · Dato’ Sri Raja Segaran JC","story":"The defendant company was wound up in 2024, after which it could act only through its liquidators. A defence sat on the file — but despite exhaustive, acknowledged notice, no one with authority maintained it. The plaintiffs asked for judgment on RM285,923.83 anyway.","courtSaid":"Granted. With section 471(1) Companies Act 2016 leave already in hand, the abandoned defence was struck out under Order 34 rule 6(1) read with Order 92 rule 4, and judgment entered on the unchallenged affidavit evidence — the Court will not read the Rules to leave a claimant without a remedy.","whyYouCare":"A defence is not a shield by mere existence on the file — someone with authority has to keep maintaining it. Acting against a company in liquidation: get your s 471 leave, put the liquidators on full notice, then move on the abandoned defence. Instructed by liquidators: parking a defended file is how judgments get entered behind you.","outcome":"GRANTED","edition":"20 July 2026","court":"High Court"},{"hook":"Unopposed is not the same as automatic","area":"Companies","tags":["🏢 Winding-up","🧱 Petition dismissed","📋 Plead the limb"],"name":"Koperasi Tunas Muda Sungai Ara Bhd v Hype Lifestyle Sdn Bhd","citation":"MA-28NCC-23-04/2026 · High Court of Malaya at Melaka · Dato’ Sri Raja Segaran JC","story":"A creditor holding a Sessions Court default judgment presented a winding-up petition. Nobody opposed it. It looked like a walkover — right up until the Court read the petition.","courtSaid":"Dismissed. The petition never identified or proved which limb of section 466(1) it relied on (such as an unsatisfied statutory demand). A winding-up order operates in rem, so an unopposed petition attracts stricter scrutiny, not lighter — and a defect going to the statutory ground itself cannot be cured by adjournment. Dismissal was without prejudice to a fresh, properly framed petition.","whyYouCare":"A judgment debt alone does not wind a company up. Serve the statutory demand, plead the specific s 466(1) limb, and prove it — even (especially) when nobody shows up on the other side. The good news for your client: a properly framed re-petition remains open.","outcome":"DISMISSED","edition":"20 July 2026","court":"High Court"}],"areas":["Civil procedure","Commercial contract","Companies","Defamation","Estate","Insurance","Probate","Security for costs"],"editions":["20 July 2026"]};

var q = document.getElementById('q');
var courtSel = document.getElementById('court');
var editionSel = document.getElementById('edition');
var areaChips = document.getElementById('areaChips');
var results = document.getElementById('results');
var count = document.getElementById('count');
var activeArea = '';

DB.editions.forEach(function (e) {
  var o = document.createElement('option');
  o.textContent = e;
  editionSel.appendChild(o);
});

['All areas'].concat(DB.areas).forEach(function (a, i) {
  var b = document.createElement('button');
  b.className = 'chip' + (i === 0 ? ' on' : '');
  b.textContent = a;
  b.onclick = function () {
    activeArea = i === 0 ? '' : a;
    Array.prototype.forEach.call(areaChips.children, function (c) {
      c.classList.toggle('on', c === b);
    });
    render();
  };
  areaChips.appendChild(b);
});

function esc(s) {
  return String(s).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;');
}

function hi(s, terms) {
  var out = esc(s);
  terms.forEach(function (t) {
    if (t.length < 2) return;
    var low = out.toLowerCase();
    var tl = t.toLowerCase();
    var res = '';
    var idx = 0;
    while (true) {
      var p = low.indexOf(tl, idx);
      if (p < 0) { res += out.substring(idx); break; }
      res += out.substring(idx, p) + '<mark>' + out.substring(p, p + t.length) + '</mark>';
      idx = p + t.length;
    }
    out = res;
  });
  return out;
}

function outcomeColor(o) {
  o = (o || '').toUpperCase();
  if (o.indexOf('DISMISS') >= 0 || o.indexOf('STRUCK') >= 0) return '#8A3B3B';
  if (o.indexOf('PART') >= 0) return '#8A6D3B';
  return '#3B6E4F';
}

function render() {
  var terms = q.value.toLowerCase().split(' ').filter(Boolean);
  var rows = DB.cases.filter(function (c) {
    if (activeArea && c.area !== activeArea) return false;
    if (courtSel.value && c.court !== courtSel.value) return false;
    if (editionSel.value && c.edition !== editionSel.value) return false;
    if (!terms.length) return true;
    var hay = [c.hook, c.name, c.citation, c.story, c.courtSaid, c.whyYouCare,
               c.area, c.outcome, c.tags.join(' ')].join(' ').toLowerCase();
    return terms.every(function (t) { return hay.indexOf(t) >= 0; });
  });

  count.textContent = rows.length + ' case' + (rows.length === 1 ? '' : 's');
  if (!rows.length) {
    results.innerHTML = '<div class="empty sans">No cases match — try fewer words, or clear a filter.</div>';
    return;
  }

  results.innerHTML = rows.map(function (c) {
    return '<details class="card">' +
      '<summary>' +
        '<div class="meta sans">' +
          '<span>' + esc(c.edition) + '</span><span>·</span>' +
          '<span>' + esc(c.court) + '</span><span>·</span>' +
          '<span>' + esc(c.area) + '</span>' +
          '<span class="outcome" style="color:' + outcomeColor(c.outcome) + '">' + esc(c.outcome) + '</span>' +
        '</div>' +
        '<div class="hook">' + hi(c.hook, terms) + '</div>' +
        '<div class="case-name">' + hi(c.name, terms) + '</div>' +
        '<div class="citation sans">' + hi(c.citation, terms) + '</div>' +
        '<div class="tagrow">' + c.tags.map(function (t) {
          return '<span class="tag sans">' + esc(t) + '</span>';
        }).join('') + '</div>' +
        '<div class="open-hint sans">Read the case &darr;</div>' +
      '</summary>' +
      '<div class="body">' +
        '<div class="label sans">The story</div><div class="text">' + hi(c.story, terms) + '</div>' +
        '<div class="label sans">The court said</div><div class="text">' + hi(c.courtSaid, terms) + '</div>' +
        '<div class="label sans">Why you care</div><div class="text">' + hi(c.whyYouCare, terms) + '</div>' +
      '</div>' +
    '</details>';
  }).join('');
}

q.addEventListener('input', render);
courtSel.addEventListener('change', render);
editionSel.addEventListener('change', render);
render();
</script>
</body>
</html>

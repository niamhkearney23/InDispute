<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Hush</title>
<meta name="description" content="That page does not exist. Here is the way back to the shop.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12112a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hush Sleep Shop">
<meta property="og:title" content="Page not found — Hush">
<meta property="og:description" content="That page does not exist. Here is the way back to the shop.">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🌙</text></svg>">
<link rel="stylesheet" href="assets/css/styles.css">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('hush.theme');
      var dark = saved ? saved === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) {}
  })();
</script>
</head>
<body data-page="404">
<a class="skip-link" href="#main">Skip to content</a>
<div data-site-header></div>

<main id="main">
  <section class="page-head">
    <div class="wrap">
      <p class="eyebrow">404</p>
      <h1>That page has gone to bed</h1>
      <p class="lead">The address you followed does not exist here. It may have been renamed, or the
        link may have been cut short somewhere along the way.</p>
      <div class="cluster mt-2">
        <a class="btn" href="shop.html">Browse the shop</a>
        <a class="btn btn--ghost" href="index.html">Back to the home page</a>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section__head">
        <div>
          <p class="eyebrow">Most likely</p>
          <h2>One of these</h2>
        </div>
      </div>
      <div class="grid grid--4" data-popular-grid></div>
    </div>
  </section>
</main>

<div data-site-footer></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/art.js"></script>
<script src="assets/js/ui.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var popular = ['cloudform-hybrid', 'contour-cool-pillow', 'stonewashed-linen-set', 'silk-sleep-mask'];
    document.querySelector('[data-popular-grid]').innerHTML = popular
      .map(HushStore.byId)
      .filter(Boolean)
      .map(function (p) { return HushUI.productCard(p); })
      .join('');
  });
</script>
</body>
</html>

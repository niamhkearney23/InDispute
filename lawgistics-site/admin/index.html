<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Lawgistics Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="app">

  <aside class="side" id="side">
    <div class="side__top">
      <button class="side__collapse" type="button" id="collapse-btn" aria-label="Collapse all groups">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3 4.5 7l4 4"/></svg>
      </button>
    </div>
    <div class="side__scroll" id="side-nav"></div>
    <div class="side__foot">
      <button type="button" id="signout">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14.5v2a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 3 16.5v-13A1.5 1.5 0 0 1 4.5 2h6A1.5 1.5 0 0 1 12 3.5v2"/><path d="M16.5 10H7m9.5 0-3-3m3 3-3 3"/></svg>
        Log out
      </button>
    </div>
  </aside>

  <div class="side-scrim" id="side-scrim"></div>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="side__collapse menu-btn" type="button" id="menu-btn" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg>
        </button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      </div>
      <button class="avatar-btn" id="avatar" type="button" aria-label="Signed in user"></button>
    </header>

    <main class="view" id="view"></main>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
</body>
</html>
